[project]
name = "foresight"
version = "0.1.0"
description = "Edge-case anticipation from PR fix-chains"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["requests>=2.31"]
llm = ["anthropic>=0.40"]

[project.scripts]
foresight = "foresight.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foresight"]
