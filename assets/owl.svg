    <path d="M428 300 C440 250 415 215 370 225 C360 245 365 270 380 290 C395 315 415 325 428 300 Z" fill="#5f5385"/>
    <path d="M222 230 l14 -6 M226 242 l14 -4 M378 230 l-14 -6 M374 242 l-14 -4" stroke="#7b6d9e" stroke-width="4" stroke-linecap="round"/>

