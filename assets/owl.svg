      <path d="M243 390 q12 12 24 0 q12 12 24 0 q12 12 24 0 q12 12 24 0 q12 12 24 0"/>
      <path d="M255 420 q12 12 24 0 q12 12 24 0 q12 12 24 0 q12 12 24 0"/>
