    <!-- binoculars held to eyes -->
    <g>
      <rect x="282" y="210" width="36" height="16" rx="5" fill="#3b3b44"/>
      <rect x="226" y="190" width="62" height="70" rx="14" fill="#4a4a55"/>
      <rect x="312" y="190" width="62" height="70" rx="14" fill="#4a4a55"/>
      <rect x="226" y="208" width="62" height="12" fill="#363640"/>
      <rect x="312" y="208" width="62" height="12" fill="#363640"/>
      <circle cx="257" cy="250" r="22" fill="#2a2a32"/>
      <circle cx="343" cy="250" r="22" fill="#2a2a32"/>
      <circle cx="257" cy="250" r="15" fill="#5fb3c9"/>
      <circle cx="343" cy="250" r="15" fill="#5fb3c9"/>
      <path d="M248 243 a10 10 0 0 1 12 -4" stroke="#e6f7fb" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M334 243 a10 10 0 0 1 12 -4" stroke="#e6f7fb" stroke-width="4" fill="none" stroke-linecap="round"/>
