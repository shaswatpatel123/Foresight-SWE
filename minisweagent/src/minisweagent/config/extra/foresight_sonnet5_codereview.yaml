# Foresight anticipation-gap benchmark, Phase-1 driven by the native Claude Code
# CLI (headless). Select with: mini-extra foresight --agent-backend claude_code -c <this>.
# For Codex, copy this file and set cli_model to a codex model + forward OPENAI_API_KEY.
#
# CLIAgent installs node at runtime inside the --writable SIF sandbox, runs
# `claude -p --output-format stream-json ...`, then captures `git diff` as the
# prediction. Phase-2 grading (run_state.sh) is identical to the mini runs.

agent:
  # backend is set by --agent-backend; left out here to avoid a duplicate-arg clash.
  # Copied from foresight_opus5_codereview.yaml, byte-identical apart from this line --
  # mirroring how foresight_claude_sonnet5.yaml relates to foresight_claude_opus5.yaml --
  # so the two round-2 arms differ by the model alone. cli_version below stays 2.1.278:
  # the Sonnet 5 round-1 sessions were written by that same CLI build.
  cli_model: "claude-sonnet-5"
  max_turns: 250
  cost_limit: 5.0
  timeout: 5400          # wall-clock budget (s) for the single CLI invocation
  # High reasoning: claude CLI --effort accepts low|medium|high|xhigh|max (xhigh is
  # the Claude Code default). extra_args is appended verbatim to the `claude -p` call.
  extra_args: '--effort high'

  # --- ROUND-2 /code-review VARIANT -------------------------------------------
  # The prompt IS the slash command, nothing else. A slash command is only
  # interpreted at the START of the message, so it cannot be appended to the task
  # via --edgecase-prompt-file; it has to replace the template.
  #
  # No task text is needed because the session is resumed (--resume-session-map):
  # the PR description, the model's reasoning and its edits are all already in the
  # conversation. Per the docs the local command reviews "commits ahead of upstream
  # plus any uncommitted changes", and --init-patch-map puts round-1's patch back in
  # the working tree, so the review target is exactly that patch.
  #
  # NOT `ultra` (launches a billed cloud review needing interactive confirmation)
  # and NOT --comment/--post (GitHub/GitLab posting).
  cli_instance_template: "/code-review high --fix"

  # Pin to the CLI that WROTE the saved sessions (they record version 2.1.278; the
  # host carries 2.1.252). Unpinned, this becomes a version comparison rather than a
  # prompt comparison, and an older binary may refuse a newer session.
  cli_version: "2.1.278"
  # install_script: |    # uncomment to override node provisioning (default: NodeSource 22.x)
  #   set -e
  #   ...

environment:
  cwd: "/testbed"
  timeout: 300
  # Seed round-1's patch AFTER the .git strip, so it stays as uncommitted working-tree
  # changes and `git diff` IS the thing /code-review is meant to review. Without this the
  # strip commits round-1 into the clean snapshot, the container has no upstream and an
  # empty diff, and the review resorts to `git clone` from GitHub to guess what changed
  # (and cannot do even that under net_isolate).
  #
  # Makes the captured patch CUMULATIVE (round-1 + round-2), so the grade phase must NOT
  # pass --init-patch-map for this config.
  codereview: true
  # --cleanenv strips host env; forward the CLI's credentials through apptainer --env.
  # Use ANTHROPIC_API_KEY (API key) OR CLAUDE_CODE_OAUTH_TOKEN (subscription token
  # from `claude setup-token`) — the latter avoids needing an API key at all.
  # Forwarded INTO the container. FORESIGHT_REUSE_ENV is the one run_state*.sh reads
  # to grade against the image's baked env instead of reinstalling; exporting it on the
  # HOST is not enough -- apptainer runs --cleanenv, so a variable absent from this list
  # simply does not exist inside. Without it every instance takes the install path, and
  # aiohttp's `make .update-pip` then dies against the uv-built /opt/venv, which has no
  # pip ("No module named pip"). Gold reused for 116 of 186; a codex grade without these
  # reused for 0 of 5. BUILD_DEPS/EXTRA_DEPS feed the fallback install branch.
  forward_env:
    # NOT ANTHROPIC_API_KEY: Claude Code prefers it over CLAUDE_CODE_OAUTH_TOKEN, so
    # forwarding it bills the API instead of the subscription. minisweagent/__init__.py
    # load_dotenv()s ~/.config/mini-swe-agent/.env, which sets it in every mini-extra
    # process -- so it is present even when the shell has it unset.
    - CLAUDE_CODE_OAUTH_TOKEN
    - ANTHROPIC_BASE_URL
    - ANTHROPIC_AUTH_TOKEN
    - BUILD_DEPS
    - EXTRA_DEPS
    - FORESIGHT_REUSE_ENV
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
  environment_class: foresightSingularity
