# Qwen3.8-Flash-Next-FP8 on vLLM -- foresight anticipation-gap benchmark.
# Same agent/environment contract as the other vLLM configs; only the model block differs.
# Run it with eval/run_mini_swe_agent.sh (set CONFIG to this file).
agent:
  system_template: |
    You are a helpful assistant that can interact multiple times with a computer shell to solve programming tasks.
    Your response must contain exactly ONE bash code block with ONE command (or commands connected with && or ||).

    Include a THOUGHT section before your command where you explain your reasoning process.
    Format your response as shown in <format_example>.

    <format_example>
    THOUGHT: Your reasoning and analysis here

    ```bash
    your_command_here
    ```
    </format_example>

    Failure to follow these rules will cause your response to be rejected.
  instance_template: |
    <pr_description>
    Consider the following PR description:
    {{task}}
    </pr_description>

    <instructions>
    # Task Instructions

    ## Overview
    You're a software engineer interacting continuously with a computer by submitting commands.
    You'll be helping implement necessary changes to meet requirements in the PR description.
    Your task is specifically to make changes to non-test files in the current directory in order to fix the issue described in the PR description in a way that is general and consistent with the codebase.

    IMPORTANT: This is an interactive process where you will think and issue ONE command, see its result, then think and issue your next command.

    For each response:
    1. Include a THOUGHT section explaining your reasoning and what you're trying to accomplish
    2. Provide exactly ONE bash command to execute

    ## Important Boundaries
    - MODIFY: Regular source code files in {{working_dir}}
    - DO NOT MODIFY: Tests, configuration files (pyproject.toml, setup.cfg, etc.)

    ## Recommended Workflow
    1. Analyze the codebase by finding and reading relevant files
    2. Create a script to reproduce the issue
    3. Edit the source code to resolve the issue
    4. Verify your fix works by running your script again
    5. Test edge cases to ensure your fix is robust

    ## Command Execution Rules
    You are operating in an environment where
    1. You write a single command
    2. The system executes that command in a subshell
    3. You see the result
    4. You write your next command

    Each response should include:
    1. A **THOUGHT** section where you explain your reasoning and plan
    2. A single bash code block with your command

    Format your responses like this:

    <format_example>
    THOUGHT: Here I explain my reasoning process, analysis of the current situation,
    and what I'm trying to accomplish with the command below.

    ```bash
    your_command_here
    ```
    </format_example>

    Commands must be specified in a single bash code block:

    ```bash
    your_command_here
    ```

    **CRITICAL REQUIREMENTS:**
    - Your response SHOULD include a THOUGHT section explaining your reasoning
    - Your response MUST include EXACTLY ONE bash code block
    - This bash block MUST contain EXACTLY ONE command (or a set of commands connected with && or ||)
    - If you include zero or multiple bash blocks, or no command at all, YOUR RESPONSE WILL FAIL
    - Do NOT try to run multiple independent commands in separate blocks in one response
    - Directory or environment variable changes are not persistent. Every action is executed in a new subshell.
    - However, you can prefix any action with `MY_ENV_VAR=MY_VALUE cd /path/to/working/dir && ...` or write/load environment variables from files

    Example of a CORRECT response:
    <example_response>
    THOUGHT: I need to understand the structure of the repository first. Let me check what files are in the current directory to get a better understanding of the codebase.

    ```bash
    ls -la
    ```
    </example_response>

    Example of an INCORRECT response:
    <example_response>
    THOUGHT: I need to examine the codebase and then look at a specific file. I'll run multiple commands to do this.

    ```bash
    ls -la
    ```

    Now I'll read the file:

    ```bash
    cat file.txt
    ```
    </example_response>

    If you need to run multiple commands, either:
    1. Combine them in one block using && or ||
    ```bash
    command1 && command2 || echo "Error occurred"
    ```

    2. Wait for the first command to complete, see its output, then issue the next command in your following response.

    ## Environment Details
    - You have a full Linux shell environment
    - Always use non-interactive flags (-y, -f) for commands
    - Avoid interactive tools like vi, nano, or any that require user input
    - If a command isn't available, you can install it

    ## Useful Command Examples

    ### Create a new file:
    ```bash
    cat <<'EOF' > newfile.py
    import numpy as np
    hello = "world"
    print(hello)
    EOF
    ```

    ### Edit files with sed:
    ```bash
    # Replace all occurrences
    sed -i 's/old_string/new_string/g' filename.py

    # Replace only first occurrence
    sed -i 's/old_string/new_string/' filename.py

    # Replace first occurrence on line 1
    sed -i '1s/old_string/new_string/' filename.py

    # Replace all occurrences in lines 1-10
    sed -i '1,10s/old_string/new_string/g' filename.py
    ```

    ### View file content:
    ```bash
    # View specific lines with numbers
    nl -ba filename.py | sed -n '10,20p'
    ```

    ### Any other command you want to run
    ```bash
    anything
    ```

    ## Submission
    When you've completed your work (reading, editing, testing), and cannot make further progress
    issue exactly the following command:

    ```bash
    echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && git add -A && git diff --cached
    ```

    This command will submit your work.
    You cannot continue working (reading, editing, testing) in any way on this task after submitting.
    </instructions>
  action_observation_template: |
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length < 10000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>
    The output of your last command was too long.
    Please try a different command that produces less output.
    If you're looking at a file you can try use head, tail or sed to view a smaller number of lines selectively.
    If you're using grep or find and it produced too much output, you can use a more selective search pattern.
    If you really need to see something from the full command's output, you can redirect output to a file and then search in that file.
    </warning>
    {%- set elided_chars = output.output | length - 10000 -%}
    <output_head>
    {{ output.output[:5000] }}
    </output_head>
    <elided_chars>
    {{ elided_chars }} characters elided
    </elided_chars>
    <output_tail>
    {{ output.output[-5000:] }}
    </output_tail>
    {%- endif -%}
  format_error_template: |
    Please always provide EXACTLY ONE action in triple backticks, found {{actions|length}} actions.

    Please format your action in triple backticks as shown in <response_example>.

    <response_example>
    Here are some thoughts about why you want to perform the action.

    ```bash
    <action>
    ```
    </response_example>

    If you have completed your assignment, please consult the first message about how to
    submit your solution (you will not be able to continue working on this task after that).
  step_limit: 250
  cost_limit: 3

environment:
  cwd: "/testbed"
  timeout: 300
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
  # Re-read these from the host and pass via --env (survives --cleanenv), so a
  # per-repo numpy pin in BUILD_DEPS/EXTRA_DEPS overrides the image's baked ENV
  # without rebuilding the image (numpy-sensitive repos: pandas ABI, xarray import).
  # FORESIGHT_REUSE_ENV=1 tells the in-image run_state*.sh to grade against the
  # environment the image already ships instead of rebuilding it.
  forward_env: [BUILD_DEPS, EXTRA_DEPS, FORESIGHT_REUSE_ENV]
  environment_class: foresightSingularity
model:
  # vLLM `--served-model-name qwen38-flash-next`
  # (serve_qwen38_flash_next.sh), weights
  # Qwen3.8-Flash-Next-FP8, served on 4xH200 at
  # --max-model-len 262144 (native ctx; 1M needs YaRN, which the server does not enable).
  # That server MUST run with --reasoning-parser qwen3. Thinking mode is on by default,
  # and without the parser the chain-of-thought lands in message.content with a raw
  # </think> tag -- the mini loop needs exactly ONE ```bash block per reply and a model
  # thinking out loud in content emits more than one. See the serve script's header.
  # Not localhost: the endpoint is on another node, so no ssh tunnel -- point litellm at it.
  model_name: "hosted_vllm/qwen38-flash-next"
  # REQUIRED, not decorative: LitellmModel.query() calls completion_cost() with no
  # try/except, and litellm raises "This model isn't mapped yet" for an unknown
  # hosted_vllm model -- the run dies on the first call without this file. litellm 1.80.0
  # (the version in penv) predates the model and has NO qwen3.8 entry of any kind, so this
  # is the only source of a price. litellm carries no *-flash-next entry at all, so prices
  # mirror its first-party qwen_ai_platform/qwen3.8-flash ($0.15/M in, $0.47/M out) -- the
  # same convention as the glm53 (zai) and deepseek configs. dashscope, together and
  # openrouter all quote that same $0.15/$0.47, so the figure is not provider-specific.
  litellm_model_registry: path/to/model_registry.json
  model_kwargs:
    custom_llm_provider: hosted_vllm
    # litellm calls this api_base directly, so a stale host here fails
    # every request even when the runner's ENDPOINT preflight is correct.
    api_base: http://<your-vllm-host>:<port>/v1
    api_key: EMPTY
    drop_params: true
    temperature: null
    # "high" is what the glm53/deepseek configs send, and this model REJECTS it:
    # 400 "Unexpected reasoning effort high. Supported types are xhigh (default),
    # medium, and low." Its tiers are low/medium/xhigh with no "high" rung, so every
    # call 400s and the whole run finishes in minutes with empty patches. drop_params
    # does not help -- it drops unsupported param NAMES, not rejected VALUES.
    # xhigh is the top tier here, matching those configs' intent of maximum reasoning.
    reasoning_effort: "xhigh"

sanity:
  corrupt_folder: ""
  container_base_path: "/testbed"
